<!doctype html>
<html lang="en" data-publication-profile="public">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="index, follow">
  
  <title>Search - Timothy Williamson Archive</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/style.css?v=20261112-3">
  <link rel="stylesheet" href="../assets/discovery.css?v=20261112-3">
<link rel="canonical" href="https://dkodsi.github.io/williamson-archive/search/">
<meta name="description" content="Search titles and full text across the digital editions of Timothy Williamson&#x27;s work, with links to matching passages.">
<meta property="og:title" content="Search – Timothy Williamson Archive">
<meta property="og:description" content="Search titles and full text across the digital editions of Timothy Williamson&#x27;s work, with links to matching passages.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://dkodsi.github.io/williamson-archive/search/">
<script type="application/ld+json" data-public-seo>{"@context":"https://schema.org","@graph":[{"@type":"WebPage","@id":"https://dkodsi.github.io/williamson-archive/search/#webpage","url":"https://dkodsi.github.io/williamson-archive/search/","name":"Search – Timothy Williamson Archive","description":"Search titles and full text across the digital editions of Timothy Williamson's work, with links to matching passages.","isPartOf":{"@id":"https://dkodsi.github.io/williamson-archive/#website"}}]}</script>
</head>
<body data-discovery-root="../" data-discovery-default-scope="text">
  <a class="skip-link" href="#catalogueResults">Skip to results</a>
  <header class="topbar">
    <a class="brand" href="../index.html">TW<span>Archive</span></a>
    <nav class="topbar-links" aria-label="Archive pages">
      <a class="topbar-link" href="../index.html" data-titles-link>Catalogue</a>
      <a class="topbar-link" href="../citations/index.html">Timeline</a>
    </nav>
  </header>

  <main id="top">
    <section class="hero">
      <h1>Search <em>the archive</em></h1>
      <form id="discoverySearch" role="search">
        <fieldset class="search-scope">
          <legend class="visually-hidden">Search in</legend>
          <label><input type="radio" name="scope" value="titles"> Titles</label>
          <label><input type="radio" name="scope" value="text" checked> Full text</label>
        </fieldset>
        <label class="visually-hidden" for="search">Search works</label>
        <div class="search-wrap">
          <span aria-hidden="true">⌕</span>
          <input id="search" type="search" placeholder="Search full text…" autocomplete="off" aria-describedby="searchHint searchStatus">
          <kbd>/</kbd>
          <button type="submit">Search</button>
        </div>
        <p id="searchHint" class="search-hint">Use &quot;quotes&quot; for phrases; * matches part of a word.</p>
      </form>
      <div id="stats" class="stats"></div>
      <p id="searchStatus" class="discovery-status" role="status" aria-live="polite"></p>
    </section>

    <section id="browse" class="catalogue">
      <details id="catalogueFilters" class="catalogue-filters" open tabindex="0" aria-label="Filter works">
        <summary>Filters<span id="filterCount"></span></summary>
      <aside aria-label="Filter works">
        <fieldset class="filter-group">
        <legend class="aside-title">Availability</legend>
        <div class="availability-options" role="radiogroup" aria-label="Digital edition availability">
          <label><input type="radio" class="availability-filter" name="availability" value="all" checked> All</label>
          <label><input type="radio" class="availability-filter" name="availability" value="available"> Editions</label>
          <label><input type="radio" class="availability-filter" name="availability" value="unavailable"> Without editions</label>
        </div>
        </fieldset>

        <fieldset class="filter-group">
        <legend class="aside-title">Type</legend>
        <label><input type="checkbox" class="type-filter" value="Book" checked> Books</label>
        <label><input type="checkbox" class="type-filter" value="Paper" checked> Papers</label>
        <label><input type="checkbox" class="type-filter" value="Public writing" checked> Public writing</label>
        <label><input type="checkbox" class="type-filter" value="Review / interview" checked> Reviews &amp; interviews</label>
        </fieldset>
      </aside>
      </details>

      <div class="results" id="catalogueResults" tabindex="-1" role="region" aria-label="Results">
        <div class="results-head">
          <div><span id="resultCountLabel" hidden><span id="resultCount"></span> works</span> <button id="clearFilters" type="button" hidden>Clear filters</button></div>
          <div class="sort-wrap">
            <label for="sort">Sort</label>
            <select id="sort">
              <option value="citations">Most cited</option>
              <option value="relevance" hidden>Best matches</option>
              <option value="newest">Newest first</option>
              <option value="oldest">Oldest first</option>
              <option value="az">Title A–Z</option>
            </select>
          </div>
        </div>
        <div id="activeFilters" class="active-filters" aria-label="Active filters" hidden></div>
        <div id="yearBuckets"><noscript><p>Full-text search needs JavaScript. <a href="../index.html">Browse the catalogue</a>.</p></noscript></div>
        <div id="fulltextGroups" class="discovery-groups" hidden></div>
        <button id="moreWorks" class="fulltext-more" type="button" hidden>Show more works</button>
        <div id="empty" hidden>No works match those filters.</div>
      </div>
    </section>
  </main>

  <footer>
    <span>Timothy Williamson Archive</span>
    <span class="footer-links"><a href="../citations/index.html">Timeline</a><a href="../exports/timothy-williamson-catalogue.bib">BibTeX</a><a href="../exports/timothy-williamson-catalogue.csv">CSV</a></span>
  </footer>

  <script src="../assets/article-search.js?v=20261112"></script>
  <script src="../assets/app.js?v=20261112-3"></script>
</body>
</html>
