<head>
  <meta charset="utf-8">

  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/style.css?v=20261112-3">
  <link rel="stylesheet" href="../assets/timeline.css?v=20261112-3">
<link rel="canonical" href="https://dkodsi.github.io/williamson-archive/citations/">
<meta name="description" content="Explore Timothy Williamson&#x27;s work by publication year and follow citation connections between works.">
<meta property="og:title" content="Timeline – Timothy Williamson Archive">
<meta property="og:description" content="Explore Timothy Williamson&#x27;s work by publication year and follow citation connections between works.">

<script type="application/ld+json" data-public-seo>{"@context":"https://schema.org","@graph":[{"@type":"CollectionPage","@id":"https://dkodsi.github.io/williamson-archive/citations/#webpage","url":"https://dkodsi.github.io/williamson-archive/citations/","name":"Timeline – Timothy Williamson Archive","description":"Explore Timothy Williamson's work by publication year and follow citation connections between works.","isPartOf":{"@id":"https://dkodsi.github.io/williamson-archive/#website"}}]}</script>
</head>
<body>
  <header class="topbar"><a class="brand" href="../index.html">TW<span>Archive</span></a>
    <nav class="topbar-links" aria-label="Archive pages">
      <a class="topbar-link" href="../index.html">Catalogue</a>
      <a class="topbar-link" href="index.html" aria-current="page">Timeline</a>
    </nav>
  </header>
  <main class="citation-map-main timeline-main">
    <h1>Timeline</h1>
    <form id="citationSearch" class="citation-map-search" role="search">
      <label class="visually-hidden" for="citationWork">Find a work</label>
      <input id="citationWork" list="citationWorkList" type="search" placeholder="Find a work…" autocomplete="off" aria-controls="timelineList citationMatches">
      <datalist id="citationWorkList"></datalist>
      <button type="submit">Find</button>
    </form>
    <p id="citationStatus" class="citation-map-status" role="status" aria-live="polite">Loading works…</p>
    <div id="citationMatches" class="timeline-matches" hidden></div>
    <div class="citation-view-controls" role="group" aria-label="Browse view">
      <button id="citationTimelineView" class="active" type="button" aria-pressed="true">Chronology</button>
      <button id="citationOverviewView" type="button" aria-pressed="false">Connections</button>
      <button id="citationFocusView" type="button" aria-pressed="false" disabled>Selected work</button>
    </div>
    <section id="timelinePanel" aria-label="Complete chronology">
      <div class="timeline-filters">
        <label>Period <select id="timelineDecade"><option value="all">All years</option></select></label>
        <label>Topic <select id="timelineTopic"><option value="all">All topics</option></select></label>
        <button id="timelineClear" type="button" hidden>Clear filters</button>
      </div>
      <div id="timelineList"></div>
      <noscript><p>Use the <a href="../index.html?sort=oldest">chronological catalogue</a> to browse the works without JavaScript.</p></noscript>
    </section>
    <section id="connectionsPanel" aria-label="Connections between works" hidden>
      <p id="citationLegend" class="citation-legend">Red: books. Size: citations within the archive. Arrows: citing → cited. Editions may share the first publication year; vertical position has no subject meaning.</p>
      <div class="connections-layout">
        <figure class="citation-graph-frame">
          <button id="citationZoomOut" class="citation-zoom-out" type="button" hidden>All connections</button>
          <svg id="citationGraph" viewBox="0 0 1000 540" role="group" aria-label="Citation connections arranged by publication year" aria-describedby="citationLegend"></svg>
          <figcaption id="citationGraphCaption"></figcaption>
        </figure>
        <section id="citationFocus" class="citation-focus" aria-label="Selected work" hidden></section>
      </div>
      <section id="citationEvidence" class="citation-evidence" aria-live="polite" tabindex="-1" hidden></section>
      <details id="connectionsList" class="connections-text-list">
        <summary>List view</summary>
        <div id="connectionsListItems"></div>
      </details>
    </section>
  </main>
  <script src="../assets/citation-map.js?v=20261112-3"></script>
</body>
</html>
